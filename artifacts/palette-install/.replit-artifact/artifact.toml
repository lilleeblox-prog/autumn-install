kind = "web"
previewPath = "/"
title = "Palette Install"
description = "A conversion-focused storefront experience for customizable installations, letting customers choose a color palette, recommended size, add-ons, and an install date before Shopify checkout."
version = "1.0.0"
id = "artifacts/palette-install"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19854

[services.development]
run = "pnpm --filter @workspace/palette-install run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/palette-install", "run", "build" ]
serve = "static"
publicDir = "artifacts/palette-install/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19854"
BASE_PATH = "/"
